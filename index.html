<!--
Project: Sederhana Video Streaming Site
Files: index.html (this file contains all HTML/CSS/JS)
Usage: Place your video file in the same folder and name it `video.mp4`, or edit the <source> src to point to your file (e.g. /assets/video.mp4 or a full URL)

Deploy options:
- Netlify (drag & drop): https://www.netlify.com/ (quick, free). See Netlify docs for drag-and-drop deploy.
- GitHub Pages: push repo and enable Pages in repo settings. See GitHub Pages quickstart.
- Vercel / Cloudflare Pages: connect repository and deploy.

Notes:
- For large videos or many viewers use a video host (YouTube/Vimeo) or a CDN; static hosts like GitHub Pages / Netlify are fine for small demo files but have storage/bandwidth limits.
- If your video is HLS (.m3u8) you need an HLS player (like hls.js) — this demo uses a simple MP4 <video> player.
-->

<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>banggar ngecor bumi</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#06b6d4;--muted:#94a3b8}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter, system-ui, Arial, sans-serif;background:linear-gradient(180deg,var(--bg),#081021);color:#e6eef6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .container{width:100%;max-width:980px}
    header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    h1{font-size:20px;margin:0}
    .player-card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.05));padding:18px;border-radius:12px;box-shadow:0 8px 30px rgba(2,6,23,0.6)}
    video{width:100%;height:auto;border-radius:8px;background:#000;display:block}
    .controls{display:flex;gap:8px;align-items:center;margin-top:10px}
    .btn{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:8px 12px;border-radius:8px;color:var(--accent);cursor:pointer}
    .playlist{margin-top:14px;display:flex;flex-direction:column;gap:8px}
    .item{display:flex;align-items:center;gap:12px;padding:8px;border-radius:8px;background:rgba(255,255,255,0.01);cursor:pointer}
    .item:hover{background:rgba(255,255,255,0.02)}
    .meta{font-size:13px;color:var(--muted)}
    footer{margin-top:14px;color:var(--muted);font-size:13px}
    @media (max-width:600px){h1{font-size:18px}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 5.25C3 4.009 4.006 3 5.25 3h13.5C19.991 3 21 4.009 21 5.25v13.5c0 1.241-1.006 2.25-2.25 2.25H5.25A2.252 2.252 0 0 1 3 18.75V5.25z" stroke="currentColor" stroke-opacity="0.9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div>
        <h1>banggar ngecor bumi</h1>
        <div class="meta">silahkan nikmati <code>video.mp4</code></div>
      </div>
    </header>

    <div class="player-card">
      <video id="player" controls preload="metadata">
        <!-- Ganti src berikut dengan nama file video Anda (mis. ./assets/video.mp4) atau URL publik -->
        <source id="source" src="video.mp4" type="video/mp4">
        Browser Anda tidak mendukung tag video.
      </video>

      <div class="controls">
        <button id="playBtn" class="btn">Play / Pause</button>
        <button id="seekBack" class="btn">-10s</button>
        <button id="seekFwd" class="btn">+10s</button>
        <label style="margin-left:auto">Quality: <select id="qualitySelect" class="btn"><option value="mp4">MP4</option></select></label>
      </div>

      <div class="playlist" id="playlist">
        <!-- contoh item playlist: ubah sesuai video yang Anda miliki -->
        <div class="item" data-src="video">
          <div>
            <strong>Sample Video</strong>
            <div class="meta">Durasi: otomatis, sumber: local</div>
          </div>
        </div>
      </div>

      <footer>
        Tips: Untuk streaming yang stabil dan banyak penonton gunakan layanan hosting video atau CDN (YouTube, Vimeo, Cloudflare Stream, atau layanan storage + CDN). Static hosts cocok untuk demo dan file kecil.
      </footer>
    </div>
  </div>

  <script>
    const player = document.getElementById('player');
    const playBtn = document.getElementById('playBtn');
    const seekBack = document.getElementById('seekBack');
    const seekFwd = document.getElementById('seekFwd');
    const playlist = document.getElementById('playlist');

    playBtn.addEventListener('click', () => {
      if (player.paused) player.play(); else player.pause();
    });
    seekBack.addEventListener('click', () => { player.currentTime = Math.max(0, player.currentTime - 10); });
    seekFwd.addEventListener('click', () => { player.currentTime = Math.min(player.duration || 0, player.currentTime + 10); });

    playlist.addEventListener('click', e => {
      const item = e.target.closest('.item');
      if (!item) return;
      const src = item.dataset.src;
      const sourceEl = document.getElementById('source');
      sourceEl.src = src;
      player.load();
      player.play();
    });

    // drag-and-drop file support (lokal preview)
    document.addEventListener('dragover', e => e.preventDefault());
    document.addEventListener('drop', e => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (!file) return;
      if (!file.type.startsWith('video/')) { alert('Silakan drop file video.'); return; }
      const url = URL.createObjectURL(file);
      document.getElementById('source').src = url;
      player.load();
      player.play();
    });
  </script>
</body>
</html>
